<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4-Month Fitness Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   THEME VARIABLES
═══════════════════════════════════════════ */
:root {
  --c1:#4A9EFF; --c2:#00D68F; --c3:#00CFCF;
  --c4:#FF7A2F; --c5:#B57AEA; --c6:#FF4F8B;
  --bonus:#FFB800;
  --r-sm:8px; --r-md:14px; --r-lg:20px;
}
[data-theme="dark"] {
  --bg:#0A0B10; --s1:#13141C; --s2:#1B1C27; --s3:#242536;
  --border:#2C2E42; --t1:#EDF0FF; --t2:#9B9EBD; --t3:#5A5D7A;
  --brand:#6C63FF; --brand-dim:rgba(108,99,255,.15);
  --green:#00D68F; --green-dim:rgba(0,214,143,.12);
  --modal-bg:#15162A; --shadow:0 12px 40px rgba(0,0,0,.55);
  --ifilter:invert(.6);
}
[data-theme="light"] {
  --bg:#F0EFE9; --s1:#FFFFFF; --s2:#F5F4F0; --s3:#ECEAE4;
  --border:#DDDBD5; --t1:#1A1A2E; --t2:#4A4A6A; --t3:#9A9AB0;
  --brand:#5C53E8; --brand-dim:rgba(92,83,232,.1);
  --green:#00A86B; --green-dim:rgba(0,168,107,.1);
  --modal-bg:#FFFFFF; --shadow:0 12px 40px rgba(0,0,0,.12);
  --ifilter:invert(.35);
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:'Outfit',-apple-system,sans-serif;
  background:var(--bg); color:var(--t1);
  min-height:100vh; -webkit-tap-highlight-color:transparent;
  transition:background .3s,color .3s;
}
button{touch-action:manipulation;font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit}
a{color:inherit;text-decoration:none}

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
.app-header{
  background:var(--s1); border-bottom:1px solid var(--border);
  padding:12px 14px 11px; position:sticky; top:0; z-index:100;
  transition:background .3s,border-color .3s;
}
.h-row1{
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; margin-bottom:9px;
}
.brand{display:flex;align-items:center;gap:9px}
.brand-icon{
  width:34px;height:34px;border-radius:9px;
  background:var(--brand-dim);border:1px solid var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:17px;
}
.brand-name{font-size:16px;font-weight:800;letter-spacing:-.4px;color:var(--t1)}
.brand-sub{font-size:9.5px;color:var(--t3);margin-top:1px}
.h-btns{display:flex;gap:6px;align-items:center}
.icon-btn{
  width:36px;height:36px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--s2);
  color:var(--t1);font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.icon-btn:active{opacity:.7}
.icon-btn.on{background:var(--brand-dim);border-color:var(--brand);color:var(--brand)}

/* Date row */
.h-date-row{
  display:flex;align-items:center;gap:8px;
  background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:6px 10px;margin-bottom:9px;
  transition:background .3s;
}
.h-date-row label{
  font-size:9.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--t3);white-space:nowrap;
}
.h-date-row input[type="date"]{
  flex:1;background:transparent;border:none;
  color:var(--t1);font-size:12.5px;
  font-family:'Space Mono',monospace;outline:none;min-width:0;
}
.h-date-row input::-webkit-calendar-picker-indicator{filter:var(--ifilter);cursor:pointer}

/* Progress */
.h-prog-row{display:flex;justify-content:space-between;margin-bottom:5px}
.h-prog-lbl{font-size:9.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.h-prog-pct{font-family:'Space Mono',monospace;font-size:11px;color:var(--green);font-weight:700}
.h-prog-track{height:4px;background:var(--s3);border-radius:100px;overflow:hidden;transition:background .3s}
.h-prog-fill{height:100%;background:linear-gradient(90deg,var(--green),#00FFD0);border-radius:100px;transition:width .6s ease;min-width:2px}

/* ═══════════════════════════════════════════
   MAIN
═══════════════════════════════════════════ */
.main{max-width:540px;margin:0 auto;padding:13px 12px 70px}

/* ═══════════════════════════════════════════
   MONTH NAV
═══════════════════════════════════════════ */
.month-nav{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r-md);padding:11px 13px;margin-bottom:10px;
  transition:background .3s,border-color .3s;
}
.nav-arr{
  width:38px;height:38px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--s2);
  color:var(--t2);font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.nav-arr:active:not(:disabled){background:var(--brand);border-color:var(--brand);color:#fff}
.nav-arr:disabled{opacity:.25;cursor:not-allowed}
.month-center{text-align:center;flex:1;padding:0 4px}
.month-name{
  font-family:'Space Mono',monospace;font-size:17px;
  font-weight:700;color:var(--t1);letter-spacing:-.4px;
}
.month-phase{font-size:9.5px;color:var(--t3);margin-top:3px;font-weight:500}
.nav-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.view-btns{
  display:flex;gap:3px;background:var(--s2);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;
}
.vbtn{
  width:29px;height:29px;border-radius:5px;border:none;
  background:transparent;color:var(--t3);font-size:13px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.vbtn.on{background:var(--brand);color:#fff}

/* ═══════════════════════════════════════════
   LEGEND
═══════════════════════════════════════════ */
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.l-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:100px;
  font-size:9px;font-weight:600;border:1px solid transparent;
}
.l-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ═══════════════════════════════════════════
   GRID VIEW
═══════════════════════════════════════════ */
.cal-card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:13px;margin-bottom:12px;
  transition:background .3s,border-color .3s;
}
.dow-row{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:2px;margin-bottom:5px;
}
.dow-row span{
  text-align:center;font-size:9px;font-weight:700;
  color:var(--t3);text-transform:uppercase;letter-spacing:.6px;padding:3px 0;
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cd{
  border-radius:7px;padding:5px 4px 4px;min-height:58px;
  display:flex;flex-direction:column;position:relative;
  transition:transform .12s,opacity .12s;
}
.cd.empty{background:transparent}
.cd.out{background:var(--s1)}
.cd.rest{background:var(--s2);border:1px solid var(--border)}
.cd.work{cursor:pointer;border:1px solid transparent}
.cd.work:active{transform:scale(.94);opacity:.8}
.cd.today .dn-w{background:var(--brand);border-radius:50%}
.cd.today .dn-w span{color:#fff}
.dn-w{
  width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:4px;
}
.dn-w span{
  font-family:'Space Mono',monospace;font-size:10px;
  font-weight:700;color:var(--t2);
}
.out .dn-w span{color:var(--t3);opacity:.35}
.rest .dn-w span{color:var(--t3)}
.w-badge{
  font-size:7.5px;font-weight:700;color:#fff;
  padding:1.5px 4px;border-radius:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  line-height:1.4;
}
.rest-emoji{font-size:11px;text-align:center;margin-top:5px}
.cdot{
  position:absolute;bottom:4px;right:4px;
  width:14px;height:14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:700;
}
.cdot.full{background:var(--green);color:#000}
.cdot.part{background:#FF7A2F;color:#fff}

/* ═══════════════════════════════════════════
   SLOT / LIST VIEW
═══════════════════════════════════════════ */
.slot-wrap{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px;
  transition:background .3s,border-color .3s;
}
.sl-row{border-bottom:1px solid var(--border)}
.sl-row:last-child{border-bottom:none}
.sl-hdr{
  display:flex;align-items:center;gap:10px;
  padding:11px 13px;cursor:pointer;transition:background .15s;
  min-height:52px;
}
.sl-hdr:active{background:var(--s2)}
.sl-date{min-width:64px}
.sl-dow{font-size:9.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.sl-dnum{
  font-family:'Space Mono',monospace;font-size:14px;
  font-weight:700;color:var(--t1);margin-top:1px;
}
.sl-mid{flex:1;min-width:0}
.sl-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:100px;
  font-size:10.5px;font-weight:600;color:#fff;
}
.sl-today-tag{
  font-size:8px;font-weight:700;color:var(--brand);
  text-transform:uppercase;letter-spacing:.5px;margin-top:2px;
}
.sl-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sl-cnt{
  font-family:'Space Mono',monospace;font-size:10px;color:var(--t3);
}
.sl-arrow{font-size:11px;color:var(--t3);transition:transform .25s;width:16px;text-align:center}
.sl-row.open .sl-arrow{transform:rotate(90deg)}
.sl-content{max-height:0;overflow:hidden;transition:max-height .32s ease;background:var(--s2)}
.sl-row.open .sl-content{max-height:700px}
.sl-inner{padding:4px 12px 13px}
.sl-prog{height:3px;background:var(--s3);border-radius:100px;margin-bottom:10px;overflow:hidden}
.sl-prog-fill{height:100%;background:var(--green);border-radius:100px;transition:width .3s}
.sl-ex{
  display:flex;align-items:center;gap:9px;
  padding:9px 10px;border-radius:9px;
  background:var(--s1);margin-bottom:4px;
  border:1.5px solid transparent;cursor:pointer;
  transition:all .12s;
}
.sl-ex:active{opacity:.75}
.sl-ex.done{background:var(--green-dim);border-color:rgba(0,214,143,.3)}
.sl-cb{
  width:20px;height:20px;border-radius:5px;border:2px solid var(--border);
  background:var(--s2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:11px;font-weight:700;transition:all .12s;
}
.sl-ex.done .sl-cb{background:var(--green);border-color:var(--green);color:#000}
.sl-ex-name{font-size:12.5px;font-weight:500;color:var(--t1)}
.sl-ex.done .sl-ex-name{text-decoration:line-through;color:var(--t3)}
.sl-ex-detail{font-size:10px;color:var(--t3);margin-top:1px}
.sl-rest-row{
  display:flex;align-items:center;gap:10px;
  padding:12px 13px;font-size:13px;color:var(--t3);font-weight:500;
}
.no-days{padding:32px 16px;text-align:center;font-size:13px;color:var(--t3)}

/* ═══════════════════════════════════════════
   STATS
═══════════════════════════════════════════ */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.sc{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r-md);padding:13px;
  transition:background .3s,border-color .3s;
}
.sc-num{
  font-family:'Space Mono',monospace;font-size:25px;
  font-weight:700;color:var(--brand);letter-spacing:-1px;
}
.sc-lbl{font-size:10px;color:var(--t3);font-weight:500;margin-top:3px}

/* ═══════════════════════════════════════════
   BONUS SECTION
═══════════════════════════════════════════ */
.bonus-prog-card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r-md);padding:13px;margin-bottom:10px;
  transition:background .3s,border-color .3s;
}
.bp-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bp-title{font-size:12.5px;font-weight:700;color:var(--t1)}
.bp-pct{font-family:'Space Mono',monospace;font-size:11px;color:var(--bonus);font-weight:700}
.bp-track{height:6px;background:var(--s3);border-radius:100px;overflow:hidden;position:relative}
.bp-fill{height:100%;background:linear-gradient(90deg,#FFB800,#FFE066);border-radius:100px;transition:width .6s}
.bp-hint{font-size:10px;color:var(--t3);margin-top:7px;line-height:1.5}

.bonus-unlocked-card{
  background:linear-gradient(135deg,rgba(255,184,0,.14),rgba(255,224,102,.07));
  border:1px solid rgba(255,184,0,.4);border-radius:var(--r-md);
  padding:16px;text-align:center;margin-bottom:10px;
  animation:bonusglow 2.5s ease infinite;
}
@keyframes bonusglow{0%,100%{box-shadow:0 0 0 0 rgba(255,184,0,.2)}50%{box-shadow:0 0 0 10px rgba(255,184,0,0)}}
.bu-icon{font-size:36px;margin-bottom:8px;display:block}
.bu-title{font-size:18px;font-weight:800;color:#FFB800;letter-spacing:-.3px}
.bu-msg{font-size:11.5px;color:var(--t2);margin-top:8px;line-height:1.6}

/* ═══════════════════════════════════════════
   MODAL
═══════════════════════════════════════════ */
.backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:300;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.backdrop.open{opacity:1;pointer-events:all}
.modal{
  background:var(--modal-bg);width:100%;max-width:540px;max-height:89vh;
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  overflow:hidden;display:flex;flex-direction:column;
  transform:translateY(50px);
  border:1px solid var(--border);border-bottom:none;
  transition:transform .32s cubic-bezier(.16,1,.3,1),background .3s;
}
.backdrop.open .modal{transform:translateY(0)}
.m-head{padding:15px 16px 13px;position:relative;flex-shrink:0}
.drag-bar{width:32px;height:3px;background:rgba(255,255,255,.25);border-radius:2px;margin:0 auto 11px}
.m-close{
  position:absolute;top:13px;right:13px;
  width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);
  color:#fff;font-size:13px;
  display:flex;align-items:center;justify-content:center;
}
.m-phase-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.6);margin-bottom:4px}
.m-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.3px}
.m-meta{display:flex;gap:11px;flex-wrap:wrap;margin-top:8px}
.m-meta span{font-size:10px;color:rgba(255,255,255,.65);display:flex;align-items:center;gap:3px}
.m-body{
  overflow-y:auto;flex:1;padding:0 15px 24px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.m-body::-webkit-scrollbar{width:3px}
.m-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sec-lbl{
  font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:.9px;color:var(--t3);margin:13px 0 6px;
}
.info-box{
  background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:9px 11px;
  font-size:11.5px;color:var(--t2);line-height:1.55;
  transition:background .3s,border-color .3s;
}
.ex-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border-radius:9px;
  background:var(--s2);border:1.5px solid transparent;
  cursor:pointer;margin-bottom:4px;transition:all .12s;
}
.ex-item:active{opacity:.75}
.ex-item.done{background:var(--green-dim);border-color:rgba(0,214,143,.3)}
.ex-cb{
  width:21px;height:21px;border-radius:5px;border:2px solid var(--border);
  background:var(--s3);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:11px;font-weight:700;transition:all .12s;
}
.ex-item.done .ex-cb{background:var(--green);border-color:var(--green);color:#000}
.ex-name{font-size:12.5px;font-weight:500;color:var(--t1);transition:color .12s}
.ex-item.done .ex-name{text-decoration:line-through;color:var(--t3)}
.ex-det{font-size:10px;color:var(--t3);margin-top:1px}
.day-prog{
  background:var(--s2);border:1px solid var(--border);
  border-radius:9px;padding:11px 12px;margin-top:13px;
  transition:background .3s,border-color .3s;
}
.dp-row{display:flex;justify-content:space-between;margin-bottom:7px}
.dp-lbl{font-size:11px;font-weight:600;color:var(--t2)}
.dp-cnt{font-family:'Space Mono',monospace;font-size:11px;color:var(--t3)}
.dp-track{height:5px;background:var(--s3);border-radius:100px;overflow:hidden}
.dp-fill{height:100%;border-radius:100px;background:var(--green);transition:width .3s}

/* ═══════════════════════════════════════════
   CELEBRATION
═══════════════════════════════════════════ */
.cel-overlay{
  position:fixed;inset:0;z-index:9000;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.72);backdrop-filter:blur(6px);
  padding:16px;
}
.cel-box{
  background:var(--s1);border:1px solid rgba(255,184,0,.5);
  border-radius:var(--r-lg);padding:28px 22px;text-align:center;
  max-width:300px;width:100%;
  box-shadow:0 0 40px rgba(255,184,0,.15);
}
.cel-emoji{font-size:48px;display:block;margin-bottom:10px}
.cel-title{font-size:20px;font-weight:800;color:#FFB800;letter-spacing:-.3px}
.cel-msg{font-size:12px;color:var(--t2);margin-top:9px;line-height:1.65}
.cel-btn{
  margin-top:16px;padding:11px 24px;border-radius:100px;
  background:#FFB800;color:#000;font-size:13px;
  font-weight:700;border:none;cursor:pointer;
  font-family:inherit;width:100%;
}

#confettiCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:8999}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────── -->
<header class="app-header">
  <div class="h-row1">
    <div class="brand">
      <div class="brand-icon">💪</div>
      <div>
        <div class="brand-name">Fitness Plan</div>
        <div class="brand-sub">Progressive · NHS-inspired · 6 days/week</div>
      </div>
    </div>
    <div class="h-btns">
      <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
    </div>
  </div>
  <div class="h-date-row">
    <label for="sdInput">Program Start</label>
    <input type="date" id="sdInput" min="2026-06-15" max="2026-11-15">
  </div>
  <div>
    <div class="h-prog-row">
      <span class="h-prog-lbl">Overall Progress</span>
      <span class="h-prog-pct" id="progPct">0%</span>
    </div>
    <div class="h-prog-track"><div class="h-prog-fill" id="progFill" style="width:0%"></div></div>
  </div>
</header>

<!-- ── MAIN ───────────────────────────────── -->
<main class="main">

  <!-- Month nav -->
  <div class="month-nav">
    <button class="nav-arr" id="prevBtn">&#8592;</button>
    <div class="month-center">
      <div class="month-name" id="monthName">— —</div>
      <div class="month-phase" id="monthPhase">Loading…</div>
    </div>
    <div class="nav-right">
      <button class="nav-arr" id="nextBtn">&#8594;</button>
      <div class="view-btns">
        <button class="vbtn on" id="gBtn" title="Grid">⊞</button>
        <button class="vbtn"    id="lBtn" title="List">☰</button>
      </div>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend" id="legend"></div>

  <!-- Grid view -->

// ─────────────────────────────────────────────────
//  DATE HELPERS
// ─────────────────────────────────────────────────
function parseDate(s){const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setHours(0,0,0,0);return dt}
function fmtDate(d){return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}

const today=new Date();today.setHours(0,0,0,0);
const MIN_D = parseDate('2026-06-15');
const MAX_D = parseDate('2026-11-15');

function clamp(d){if(d<MIN_D)return new Date(MIN_D);if(d>MAX_D)return new Date(MAX_D);return d}
function loadSD(){const s=localStorage.getItem('fp_start');if(s)return clamp(parseDate(s));return new Date(MIN_D)}

//  STATE
// ─────────────────────────────────────────────────
let startDate = loadSD();
let viewDate  = new Date(startDate.getFullYear(),startDate.getMonth(),1);

let isGrid    = localStorage.getItem('fp_view') !=='list';
let currentW  = null;
const openSlots = new Set(); // per-session slot accordion state

// Jump viewDate to today's month if today is in program
(function(){
  const pd = Math.round((today-startDate)/86400000)+1;
  if(pd>=1 && pd<=140){ viewDate=new Date(today.getFullYear(),today.getMonth(),1); }
})();

// ─────────────────────────────────────────────────
//  PROGRAM LOGIC
// ─────────────────────────────────────────────────
const bonusKey='fp_bonus', celebKey='fp_bonus_cel';
function bonusUnlocked(){return localStorage.getItem(bonusKey)==='1'}
function progMax(){return bonusUnlocked()?140:112}

function getPD(date){return Math.round((date-startDate)/86400000)+1}
function getDK(pd){const c=((pd-1)%7)+1;return c===7?'rest':'day'+c}
function getPhase(pd){
  if(pd<=14)  return P.m1a;
  if(pd<=28)  return P.m1b;
  if(pd<=56)  return P.m2;
  if(pd<=84)  return P.m3;
  if(pd<=112) return P.m4;
  return P.m5;
}
function isBonus(pd){return pd>112&&pd<=140}

function getW(date){
  const pd=getPD(date);
  if(pd<1||pd>progMax())return null;
  const dk=getDK(pd);
  if(dk==='rest')return{isRest:true,pd};
  const ph=getPhase(pd), bon=isBonus(pd);
  return{
    isRest:false,pd,dk,phase:ph,
    exercises:ph[dk],title:NAMES[dk],
    color:bon?BONUS_C:C[dk],
    bg:bon?BONUS_BG:LBG[dk],
    bd:bon?BONUS_BD:LBD[dk],
    dur:ph.duration,label:ph.label,note:ph.note,
    bonus:bon,
    short:bon?'★ '+SHORT[dk]:SHORT[dk],
  };
}

const SK=(pd,i)=>`fp_${pd}_${i}`;
function isDone(pd,i){return localStorage.getItem(SK(pd,i))==='1'}
function toggle(pd,i){const k=SK(pd,i);localStorage.getItem(k)==='1'?localStorage.removeItem(k):localStorage.setItem(k,'1')}
function getComp(w){
  if(!w||w.isRest)return null;
  const t=w.exercises.length;
  let d=0;for(let i=0;i<t;i++)if(isDone(w.pd,i))d++;
  return{done:d,total:t};
}

// ─────────────────────────────────────────────────
//  PROGRESS
// ─────────────────────────────────────────────────
function calcProg(){
  let tEx=0,dEx=0,doneDays=0;
  for(let pd=1;pd<=112;pd++){
    const dk=getDK(pd);if(dk==='rest')continue;
    const ex=getPhase(pd)[dk],t=ex.length;
    let d=0;for(let i=0;i<t;i++)if(isDone(pd,i))d++;
    tEx+=t;dEx+=d;if(d===t&&t>0)doneDays++;
  }
  return{pct:tEx>0?Math.round(dEx/tEx*100):0,doneDays};
}

function updateProgress(){
  const{pct,doneDays}=calcProg();
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progPct').textContent=pct+'%';
  document.getElementById('stDone').textContent=doneDays;

  const todayPD=getPD(today);
  document.getElementById('stWeek').textContent=(todayPD>=1&&todayPD<=140)?Math.ceil(todayPD/7):'—';

  // Recalculate total workout days
  const mx=progMax();let wd=0,rd=0;
  for(let pd=1;pd<=mx;pd++){if(getDK(pd)==='rest')rd++;else wd++;}
  document.getElementById('stTotal').textContent=wd;
  document.getElementById('stRest').textContent=rd;

  // Bonus check
  if(pct>=85&&!bonusUnlocked()){
    localStorage.setItem(bonusKey,'1');
    if(localStorage.getItem(celebKey)!=='1'){
      setTimeout(()=>{showCelebration();localStorage.setItem(celebKey,'1');},500);
    }
  }
  renderBonusArea(pct);
}

function renderBonusArea(pct){
  const area=document.getElementById('bonusArea');

    area.innerHTML=`
      <div class="bonus-unlocked-card">
        <span class="bu-icon">🏆</span>
        <div class="bu-title">★ Bonus Month Unlocked!</div>

      </div>`;
  } else {
    const toward=Math.min(100,Math.round(pct/85*100));
    const left=Math.max(0,85-pct);
    area.innerHTML=`
      <div class="bonus-prog-card">
        <div class="bp-hdr">
          <div class="bp-title">🔓 Toward Bonus Month 5</div>
          <div class="bp-pct">${pct}% / 85%</div>
        </div>
        <div class="bp-track"><div class="bp-fill" style="width:${toward}%"></div></div>
        <div class="bp-hint">${left>0?`Complete ${left}% more to unlock a bonus 5th month with new exercises!`:'🔥 Almost there — keep going!'}</div>
      </div>`;
  }
}

function launchConfetti(){
  const cv=document.getElementById('confettiCanvas');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const cols=['#6C63FF','#00D68F','#FF7A2F','#FF4F8B','#4A9EFF','#FFB800','#B57AEA','#00CFCF'];
  const ps=Array.from({length:150},()=>({
    x:Math.random()*cv.width, y:Math.random()*cv.height-cv.height*1.2,
    w:Math.random()*12+4, h:Math.random()*6+2,
    col:cols[Math.floor(Math.random()*cols.length)],
    vy:Math.random()*4+1.5, vx:(Math.random()-.5)*2,
    ang:Math.random()*Math.PI*2, sp:(Math.random()-.5)*.14,
  }));
  let fr=0;
  function anim(){
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive=false;
    ps.forEach(p=>{
      p.y+=p.vy;p.x+=p.vx;p.ang+=p.sp;
      if(p.y<cv.height)alive=true;
      ctx.save();
      ctx.translate(p.x+p.w/2,p.y+p.h/2);
      ctx.rotate(p.ang);
      ctx.globalAlpha=Math.max(0,.9-p.y/cv.height*.6);
      ctx.fillStyle=p.col;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    fr++;
    if(alive&&fr<360)requestAnimationFrame(anim);
    else ctx.clearRect(0,0,cv.width,cv.height);
  }
  anim();
}

// ─────────────────────────────────────────────────
//  LEGEND
// ─────────────────────────────────────────────────
function buildLegend(){
  const el=document.getElementById('legend');el.innerHTML='';
  Object.entries(NAMES).forEach(([k,n])=>{
    const ch=document.createElement('div');ch.className='l-chip';
    ch.style.background=LBG[k];ch.style.borderColor=LBD[k];ch.style.color=C[k];
    ch.innerHTML=`<span class="l-dot" style="background:${C[k]}"></span>${n}`;
    el.appendChild(ch);
  });
  if(bonusUnlocked()){
    const ch=document.createElement('div');ch.className='l-chip';
    ch.style.background=BONUS_BG;ch.style.borderColor=BONUS_BD;ch.style.color=BONUS_C;
    ch.innerHTML=`<span class="l-dot" style="background:${BONUS_C}"></span>★ Bonus Month`;
    el.appendChild(ch);
  }
}

// ─────────────────────────────────────────────────
//  NAV HELPERS
// ─────────────────────────────────────────────────
function endDate(){return new Date(startDate.getTime()+progMax()*86400000)}
function setupNav(){
  const em=endDate();
  const sm=new Date(startDate.getFullYear(),startDate.getMonth(),1);
  const em2=new Date(em.getFullYear(),em.getMonth(),1);
  document.getElementById('prevBtn').disabled=viewDate<=sm;
  document.getElementById('nextBtn').disabled=viewDate>=em2;
}
function updateMonthLabel(){
  const yr=viewDate.getFullYear(),mo=viewDate.getMonth();
  document.getElementById('monthName').textContent=`${MONTHS[mo]} ${yr}`;
  const first=new Date(yr,mo,1),last=new Date(yr,mo+1,0);
  const phases=new Set();
  for(let d=new Date(first);d<=last;d=new Date(d.getTime()+86400000)){
    const pd=getPD(d);
    if(pd>=1&&pd<=14)phases.add('M1 Wk1–2');
    else if(pd<=28)phases.add('M1 Wk3–4');
    else if(pd<=56)phases.add('Month 2');
    else if(pd<=84)phases.add('Month 3');
    else if(pd<=112)phases.add('Month 4');
    else if(pd<=140)phases.add('★ Bonus');
  }
  document.getElementById('monthPhase').textContent=phases.size?[...phases].join(' · '):'Outside program';
}

// ─────────────────────────────────────────────────
//  GRID RENDER
// ─────────────────────────────────────────────────
function renderGrid(){
  const yr=viewDate.getFullYear(),mo=viewDate.getMonth();
  const grid=document.getElementById('calGrid');grid.innerHTML='';
  const first=new Date(yr,mo,1);
  let dow=(first.getDay()+6)%7;
  for(let i=0;i<dow;i++){const e=document.createElement('div');e.className='cd empty';grid.appendChild(e);}
  const dim=new Date(yr,mo+1,0).getDate();
  for(let d=1;d<=dim;d++){
    const dt=new Date(yr,mo,d);dt.setHours(0,0,0,0);
    const w=getW(dt);
    const cell=document.createElement('div');cell.className='cd';
    const dw=document.createElement('div');dw.className='dn-w';
    const dn=document.createElement('span');dn.textContent=d;
    dw.appendChild(dn);cell.appendChild(dw);
    if(dt.getTime()===today.getTime())cell.classList.add('today');
    if(!w){cell.classList.add('out')}
    else if(w.isRest){
      cell.classList.add('rest');
      const re=document.createElement('div');re.className='rest-emoji';re.textContent='😴';
      cell.appendChild(re);
    } else {
      cell.classList.add('work');
      if(w.bonus)cell.classList.add('bonus');
      cell.style.background=w.bg;cell.style.borderColor=w.bd;
      const b=document.createElement('div');b.className='w-badge';
      b.style.background=w.color;b.textContent=w.short;
      cell.appendChild(b);
      const comp=getComp(w);
      if(comp&&comp.done>0){
        const dot=document.createElement('div');
        dot.className='cdot '+(comp.done===comp.total?'full':'part');
        dot.textContent=comp.done===comp.total?'✓':comp.done;
        cell.appendChild(dot);
      }
      cell.addEventListener('click',()=>openModal(w,dt));
    }
    grid.appendChild(cell);
  }
}

// ─────────────────────────────────────────────────
//  SLOT RENDER
// ─────────────────────────────────────────────────
function renderSlot(){
  const yr=viewDate.getFullYear(),mo=viewDate.getMonth();
  const list=document.getElementById('slotList');list.innerHTML='';
  const dim=new Date(yr,mo+1,0).getDate();
  let hasDays=false;
  for(let d=1;d<=dim;d++){
    const dt=new Date(yr,mo,d);dt.setHours(0,0,0,0);
    const w=getW(dt);if(!w)continue;
    hasDays=true;
    const row=document.createElement('div');row.className='sl-row';
    const sk=fmtDate(dt);
    if(openSlots.has(sk))row.classList.add('open');
    const dow=DOWS[(dt.getDay()+6)%7];
    const dstr=d+' '+MONTHS[mo].slice(0,3);
    const isToday=dt.getTime()===today.getTime();

    if(w.isRest){
      row.innerHTML=`<div class="sl-rest-row"><span style="font-size:22px">😴</span><div><div class="sl-dow">${dow}</div><div class="sl-dnum">${dstr}</div></div><span style="margin-left:8px">Rest Day</span></div>`;
    } else {
      const comp=getComp(w);
      const pct=comp?Math.round(comp.done/comp.total*100):0;
      const isDayDone=comp&&comp.done===comp.total&&comp.total>0;

      const hdr=document.createElement('div');hdr.className='sl-hdr';
      hdr.innerHTML=`
        <div class="sl-date"><div class="sl-dow">${dow}</div><div class="sl-dnum">${dstr}</div></div>
        <div class="sl-mid">
          <div class="sl-badge" style="background:${w.color}">${w.short}</div>
          ${isToday?'<div class="sl-today-tag">● TODAY</div>':''}
        </div>
        <div class="sl-right">
          ${comp?`<span class="sl-cnt">${comp.done}/${comp.total}</span>`:''}
          ${isDayDone?'<span style="color:var(--green);font-size:15px">✓</span>':''}
          <span class="sl-arrow">▶</span>
        </div>`;

      hdr.addEventListener('click',()=>{
        if(openSlots.has(sk))openSlots.delete(sk);else openSlots.add(sk);
        row.classList.toggle('open');
      });

      const content=document.createElement('div');content.className='sl-content';
      const inner=document.createElement('div');inner.className='sl-inner';

      // Progress bar
      const pb=document.createElement('div');pb.className='sl-prog';
      const pf=document.createElement('div');pf.className='sl-prog-fill';
      const pfid='spf_'+sk.replace(/-/g,'');
      pf.id=pfid;pf.style.width=pct+'%';
      pb.appendChild(pf);inner.appendChild(pb);

      // Exercises
      w.exercises.forEach((ex,idx)=>{
        const item=document.createElement('div');
        item.className='sl-ex'+(isDone(w.pd,idx)?' done':'');
        const cb=document.createElement('div');cb.className='sl-cb';cb.textContent=isDone(w.pd,idx)?'✓':'';
        const info=document.createElement('div');
        info.innerHTML=`<div class="sl-ex-name">${ex.n}</div><div class="sl-ex-detail">${ex.d}</div>`;
        item.appendChild(cb);item.appendChild(info);
        item.addEventListener('click',e=>{
          e.stopPropagation();
          toggle(w.pd,idx);
          const done=isDone(w.pd,idx);
          item.classList.toggle('done',done);cb.textContent=done?'✓':'';
          const c2=getComp(w);
          const pf2=document.getElementById(pfid);
          if(pf2&&c2)pf2.style.width=Math.round(c2.done/c2.total*100)+'%';
          // Update count in header
          const cntEl=hdr.querySelector('.sl-cnt');
          if(cntEl&&c2)cntEl.textContent=`${c2.done}/${c2.total}`;
          renderGrid();updateProgress();
        });
        inner.appendChild(item);
      });

      content.appendChild(inner);
      row.appendChild(hdr);row.appendChild(content);
    }
    list.appendChild(row);
  }
  if(!hasDays){list.innerHTML='<div class="no-days">No program days in this month.<br>Use navigation to find your program months.</div>';}
}

// ─────────────────────────────────────────────────
//  RENDER ALL
// ─────────────────────────────────────────────────
function renderViews(){
  setupNav();updateMonthLabel();
  if(isGrid)renderGrid();else renderSlot();
}

// ─────────────────────────────────────────────────
//  MODAL
// ─────────────────────────────────────────────────
function openModal(w,date){
  currentW=w;
  const head=document.getElementById('mHead');
  head.style.background=`linear-gradient(140deg,${w.color}CC,${w.color}88)`;
  head.style.borderBottom=`1px solid ${w.color}44`;
  document.getElementById('mPhase').textContent=w.label;
  document.getElementById('mTitle').textContent=w.title+(w.bonus?' ★':'');
  document.getElementById('mDate').textContent=date.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  document.getElementById('mDur').textContent=w.dur;
  document.getElementById('mPD').textContent=w.pd;
  const body=document.getElementById('mBody');body.innerHTML='';

  const lbl=t=>{const e=document.createElement('div');e.className='sec-lbl';e.textContent=t;body.appendChild(e)};
  const inf=h=>{const e=document.createElement('div');e.className='info-box';e.innerHTML=h;body.appendChild(e)};

  lbl('📋 Phase Note');inf(w.note);
  lbl('🌤 Warm-Up (5 min)');inf(WARMUP);
  lbl('💪 Exercises');

  w.exercises.forEach((ex,idx)=>{
    const item=document.createElement('div');
    item.className='ex-item'+(isDone(w.pd,idx)?' done':'');
    const cb=document.createElement('div');cb.className='ex-cb';cb.textContent=isDone(w.pd,idx)?'✓':'';
    const info=document.createElement('div');
    info.innerHTML=`<div class="ex-name">${ex.n}</div><div class="ex-det">${ex.d}</div>`;
    item.appendChild(cb);item.appendChild(info);
    item.addEventListener('click',()=>{
      toggle(w.pd,idx);
      const done=isDone(w.pd,idx);
      item.classList.toggle('done',done);cb.textContent=done?'✓':'';
      refreshMP();renderViews();updateProgress();
    });
    body.appendChild(item);
  });

  lbl('🌙 Cool-Down (5 min)');inf(COOLDOWN);
  lbl('📌 Form Reminders');inf(FORMTIPS);

  const prog=document.createElement('div');prog.className='day-prog';prog.id='dpBox';
  body.appendChild(prog);refreshMP();

  document.getElementById('backdrop').classList.add('open');
  body.scrollTop=0;
}

function refreshMP(){
  if(!currentW)return;
  const c=getComp(currentW);if(!c)return;
  const pct=c.total>0?Math.round(c.done/c.total*100):0;
  const box=document.getElementById('dpBox');if(!box)return;
  box.innerHTML=`
    <div class="dp-row"><span class="dp-lbl">Session Progress</span><span class="dp-cnt">${c.done}/${c.total}</span></div>
    <div class="dp-track"><div class="dp-fill" style="width:${pct}%"></div></div>`;
}

function closeModal(){document.getElementById('backdrop').classList.remove('open');currentW=null;}

// ─────────────────────────────────────────────────
//  THEME & VIEW MODE
// ─────────────────────────────────────────────────
function applyTheme(){
  document.documentElement.setAttribute('data-theme',isDark?'dark':'light');
  document.getElementById('themeBtn').textContent=isDark?'🌙':'☀️';
  localStorage.setItem('fp_theme',isDark?'dark':'light');
}
function applyView(){
  document.getElementById('gridView').classList.toggle('hidden',!isGrid);
  document.getElementById('slotView').classList.toggle('hidden',isGrid);
  document.getElementById('gBtn').classList.toggle('on',isGrid);
  document.getElementById('lBtn').classList.toggle('on',!isGrid);
  localStorage.setItem('fp_view',isGrid?'grid':'list');
  if(isGrid)renderGrid();else renderSlot();
}

// ─────────────────────────────────────────────────
//  START DATE INPUT
// ─────────────────────────────────────────────────
const sdEl=document.getElementById('sdInput');
sdEl.value=fmtDate(startDate);
sdEl.addEventListener('change',()=>{
  if(!sdEl.value)return;
  startDate=clamp(parseDate(sdEl.value));
  sdEl.value=fmtDate(startDate);
  localStorage.setItem('fp_start',sdEl.value);
  viewDate=new Date(startDate.getFullYear(),startDate.getMonth(),1);
  // Jump to today's month if in program
  const pd=getPD(today);
  if(pd>=1&&pd<=progMax())viewDate=new Date(today.getFullYear(),today.getMonth(),1);
  buildLegend();renderViews();updateProgress();
});

// ─────────────────────────────────────────────────
//  EVENTS
// ─────────────────────────────────────────────────
document.getElementById('prevBtn').addEventListener('click',()=>{viewDate.setMonth(viewDate.getMonth()-1);renderViews();});
document.getElementById('nextBtn').addEventListener('click',()=>{viewDate.setMonth(viewDate.getMonth()+1);renderViews();});
document.getElementById('mClose').addEventListener('click',closeModal);
document.getElementById('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal();});
document.getElementById('themeBtn').addEventListener('click',()=>{isDark=!isDark;applyTheme();});
document.getElementById('gBtn').addEventListener('click',()=>{isGrid=true;applyView();});
document.getElementById('lBtn').addEventListener('click',()=>{isGrid=false;applyView();});

// ─────────────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────────────
applyTheme();
buildLegend();
renderViews();
updateProgress();

// Fire celebration if it hasn't shown yet this page load
if(bonusUnlocked()&&localStorage.getItem(celebKey)!=='1'){
  setTimeout(()=>{showCelebration();localStorage.setItem(celebKey,'1');},700);
}
</script>
